</head>

<body>

    <nav class="navbar">
        <ul>
            <img src="static/images/logo2.png" alt="Logo" class="corner-logo">
            <li class="brand"><a href="index.html"></a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="architecture/architecture.html">Architecture</a></li>

            <li><a href="transportation/transportation.html">Transportation</a></li>
            <li><a href="technology/technology.html">Technology</a></li>
        </ul>
    </nav>

    <main>
        <h3>Home Page</h3>
        <p>Welcome to Cyberseum, the digital museum with all types of artworks for the new age.</p>

        <div class="slideshow-container">

            <div class="slide fade">
                <img src="static/images/artwork1.jpg" alt="Art">
            </div>

            <div class="slide fade">
                <img src="static/images/history1.jpg" alt="History">
            </div>

            <div class="slide fade">
                <img src="static/images/architecture1.jpg" alt="Architecture">
            </div>

            <div class="slide fade">
                <img src="static/images/nature1.jpg" alt="Nature">
            </div>

            <div class="slide fade">
                <img src="static/images/transportation1.jpg" alt="Transportation">
            </div>

            <div class="slide fade">
                <img src="static/images/technology1.jpg" alt="Technology">
            </div>


            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>

        </div>

    </main>

    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("slide");

            if (n > slides.length) { slideIndex = 1 }
            if (n < 1) { slideIndex = slides.length }

            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }

            slides[slideIndex - 1].style.display = "block";
        }
    </script>

</body>
